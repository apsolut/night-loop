# NIGHT LOOP backlog. The research / discovery phase (see idea-to-product-pipeline.md) fills
# M1+ from the derived spec. M0 is always first and always present: nothing is verifiable
# without the harness. Acceptance criteria must be behavioral and checkable against seeded data,
# never "implemented".

- id: M0-harness
  depends_on: []
  gated: false
  acceptance:
    - "From native PowerShell on Windows, bun run build, typecheck, lint, and test:unit execute real checks with no placeholder command and all pass"
    - "The hard-tier unit suite proves path normalization, atomic file state, command argument preservation, and fixture cleanup in a repository path containing spaces"
    - "bun run test:e2e executes a deterministic CLI fixture with no real Claude call or network access, and the ratchet records the exact passing test commands"
    - "A deterministic interaction sentinel fails the suite if any seeded Claude run requests clarification, approval, confirmation, edit permission, or user input"

- id: M1-claude-command-surface
  depends_on: [M0-harness]
  gated: false
  acceptance:
    - "night-loop full follows the exact parser and execution path of night-loop start --permissions full, with no confirmation and no separate implementation path"
    - "night-loop start without a permissions option selects workspace permission, and status, stop, and resume never ask a question"
    - "night-loop setup is the only attended command and records the approved goal plus settings before the supervisor starts"
    - "Resume preserves the prior permission profile and limits without upgrading either value"
    - "A seeded Claude output that requests clarification, approval, confirmation, edit permission, command permission, or user input is classified as interaction_required and cannot leave the command waiting"

- id: M2-native-claude-supervisor
  depends_on: [M1-claude-command-surface]
  gated: false
  acceptance:
    - "From native PowerShell, one documented command starts one interactive Claude Code session without WSL or tmux"
    - "PowerShell and POSIX launchers call the same Bun supervisor core and produce equivalent state transitions from the same seed"
    - "A fake Claude executable proves the supervisor preserves repository paths and arguments containing spaces, quotes, Unicode, and shell metacharacters without shell evaluation"
    - "The supervisor uses the installed Claude Code subscription session and never accepts or requests a metered API key"
    - "Only one implementer session runs at a time; the independent night-loop-judge remains verification infrastructure rather than a second implementation lane"

- id: M3-durable-resume-and-halt
  depends_on: [M2-native-claude-supervisor]
  gated: false
  acceptance:
    - "A seeded Claude process exit relaunches the loop with progress.md and Git state injected, continuing the same backlog item"
    - "Seeded step progress resets the stall counter, while seeded inactivity triggers bounded relaunch with deterministic test backoff"
    - "Stop terminates the complete child process tree, removes ACTIVE, preserves resumable state and logs, and returns the documented exit code"
    - "HALTED values done, blocked, and budget each stop the supervisor without leaving a live Claude process"
    - "A rejected CLAIM_DONE removes the claim and continues only after the independent full harness reports the exact failing command; a green full harness halts as done"

- id: M4-unattended-safety-policy
  depends_on: [M3-durable-resume-and-halt]
  gated: false
  acceptance:
    - "A seeded full-permission run proves full changes Claude workspace authority only; containment and external-action policy remain unchanged"
    - "Seeded push, publish, deploy, destructive deletion, unapproved network fetch, and production-write attempts are denied and recorded without halting unrelated buildable work"
    - "Security-surface work uses seeded data and test credentials only and writes a review-before-production note to the morning digest"
    - "No credential value appears in the repository, prompt capture, process arguments, logs, or test snapshots"
    - "A missing authority or missing ground truth produces a structured blocked result, shelves that milestone, and continues to the next buildable milestone without asking the sleeping owner"

- id: M5-portable-install-and-ci
  depends_on: [M4-unattended-safety-policy]
  gated: false
  acceptance:
    - "A clean Windows fixture follows the PowerShell quick start with no WSL or Git Bash and reaches a green doctor check using only documented prerequisites"
    - "A clean Linux container fixture follows the POSIX quick start and reaches the same green doctor check using the same Bun core"
    - "Committed CI defines Windows, Linux, and macOS jobs that run build, typecheck, lint, unit, and deterministic end-to-end suites with fixed Bun and Git prerequisites"
    - "Generated Claude hooks resolve scripts relative to the project, and relocating a seeded repository does not change hook behavior"
    - "The public install footprint contains no apsolut-agents payload, bootstrap block, dependency, setup action, or runtime reference"
    - "Documentation presents one Claude session, one arm command, zero execution-time questions, and no requirement for production credentials or irreversible external actions"

- id: M6-cross-os-matrix-certification
  depends_on: [M5-portable-install-and-ci]
  gated: hard-block
  acceptance:
    - "The same commit passes build, typecheck, lint, test:unit, and deterministic test:e2e on native windows-latest, ubuntu-latest, and macos-latest runners"
    - "Each operating-system job uploads a doctor report that records OS, architecture, Bun version, Git version, and zero missing required capabilities without exposing environment secrets"
    - "A failure on any operating system remains red and cannot be replaced by a passing result from another operating system"

- id: M7-live-claude-smoke
  depends_on: [M5-portable-install-and-ci]
  gated: hard-block
  acceptance:
    - "With owner-approved test authentication, Claude Code completes a bounded probe from an empty temporary working directory, asks no question, and leaves no file diff"
    - "With owner-approved test authentication, Claude Code executes one seeded backlog task inside the jail, the repository independently verifies the expected fixture change, and Claude cannot push, publish, deploy, or write to production"
    - "The live smoke records the Claude Code CLI version, exit state, elapsed time, permission profile, and redacted evidence without recording credentials or secret-bearing prompts"

- id: M8-provider-neutral-turn-supervisor
  depends_on: [M4-unattended-safety-policy]
  gated: false
  acceptance:
    - "night-loop setup --provider codex, grok, or claude records the provider in the contract, start without a provider option keeps the recorded provider, and an unknown provider is rejected with invalid_arguments before any binary is launched"
    - "For a turn-based provider, start returns running without waiting for the first turn, and the detached supervisor records the provider session id in run.json once the seeded turn output arrives"
    - "Between turns the supervisor executes the unchanged Stop-hook verifier and persists its exact block reason as the next prompt; a seeded CLAIM_DONE with a green full harness halts the run as done and no further provider turn is launched"
    - "A seeded non-zero provider exit triggers bounded relaunch that resumes the recorded session id with deterministic test backoff, and exhausting the relaunch budget halts the run as budget"
    - "stop terminates the running provider process and the supervisor, preserves the session id, and resume relaunches the same provider with the same permission profile and limits without upgrading either"
    - "A seeded final message that asks for clarification or approval is recorded as interaction_required while the next turn still starts, and five consecutive interaction turns halt the run as interaction_required"
    - "Codex launch argument arrays map workspace to a workspace-write sandbox with approval never and full to danger-full-access with approval never, carry the NIGHT LOOP hooks as config overrides, pass the prompt verbatim with spaces, quotes, and Unicode, and no OPENAI or CODEX API key reaches the child"

- id: M9-grok-adapter-and-hook-bridge
  depends_on: [M8-provider-neutral-turn-supervisor]
  gated: false
  acceptance:
    - "Grok launch argument arrays map workspace to dontAsk with the generated allow and deny rules and full to bypassPermissions with the same deny rules, disable plan mode and web search, cap turns, pre-assign the session id, and no XAI or GROK API key reaches the child"
    - "The hook bridge rewrites a seeded Grok run_terminal_command that pushes to a remote into a denial from the unchanged gate, flags a seeded search_replace into a security-surface path for morning review, and expands a seeded Codex apply_patch so each touched path is gated"
    - "start writes the Grok project hook file that binds gate, loop, resume, and events through the bridge with absolute paths, and the bridged Stop hook returns the same block reason loop.ts returns for the same seeded repository"
    - "resume passes the recorded Grok session id with --resume and never upgrades the permission profile or limits"

- id: M10-claude-current-feature-adoption
  depends_on: [M2-native-claude-supervisor]
  gated: false
  acceptance:
    - "After a seeded background launch that prints only the short id line, run.json carries the full sessionId resolved from claude agents --json, stop uses the short id, and resume uses the full sessionId"
    - "status reports state, status, and waitingFor from the native agent record, and a seeded waiting session is recorded as interaction_required evidence exactly once per transition"
    - "doctor requires Claude Code 2.1.300 or newer, reports the installed version, and the remediation names the floor"
    - "Generated settings carry CLAUDE_CODE_STOP_HOOK_BLOCK_CAP and CLAUDE_CODE_RESUME_INTERRUPTED_TURN, and setup --model and --effort reach the Claude launch argv verbatim and are preserved by resume"
    - "status and the morning receipt include the redacted tail of claude logs for the session, and a seeded credential-shaped line in that output never reaches run state, receipt, or event tape"

- id: M11-stuck-detection-and-think-turns
  depends_on: [M8-provider-neutral-turn-supervisor]
  gated: false
  acceptance:
    - "The supervisor classifies a run as stuck from the event tape alone when the same red ratchet line, the same denied action category, or an unchanged working tree repeats for three consecutive turns, and a healthy seeded run is never classified as stuck"
    - "A stuck turn-based run gets exactly one think turn: the provider is launched read-only (Codex read-only sandbox, Grok with read-only allow rules), the prompt carries the evidence and asks for a root cause and three alternatives, the answer is stored, and the next build prompt is the verifier reason plus the chosen plan"
    - "With setup --consult codex or grok, a stuck run first gets a read-only second opinion from that provider with no edit authority and no API key in its environment, the opinion is stored and quoted in the think prompt, and setup --consult claude is rejected before any launch"
    - "Every recovery, stuck verdict, and think outcome appends one line to .night-loop/lessons.md, and resume and think prompts carry the recent lessons"
    - "A second identical stuck episode after a think turn gets one more think turn; a third shelves that path under Blocked in progress.md with the plan attached, tells the agent to pick another milestone, and the night continues"
    - "A stuck Claude background session receives the think prompt as its next turn through native resume, recorded as think.injected, and its completion is detected from STEP progress"
